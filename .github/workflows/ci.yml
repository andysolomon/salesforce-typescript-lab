name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Type-check, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build LWC JavaScript
        run: npm run build

      - name: Confirm the build did not change committed files
        run: git diff --exit-code

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Check formatting
        run: npm run prettier:verify
